<title>Alineación · Acuario · 29 jul 2026</title>
<style>
  :root{
    --void:#0a0917; --void2:#05050c;
    --aqua:#4fd6e6; --aqua2:#2b8fb0;
    --gold:#f6c453; --goldE:#c9852b; --hot:#fff7de;
    --moon:#eef1f8; --moonE:#9aa3ba;
    --pluto:#d64a66; --plutoG:#7a1730;
    --text:#c9d1e2; --muted:#7f889f;
    --serif: Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;
    --mono: ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  }
  html,body{margin:0;background:#04040a;color:var(--text);
    font-family:var(--mono);-webkit-font-smoothing:antialiased;}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:28px 16px;box-sizing:border-box;}
  .chart{width:100%;max-width:660px;height:auto;display:block;
    filter:drop-shadow(0 24px 60px rgba(0,0,0,.6));border-radius:6px;}
  text{font-family:var(--mono);}
  .serif{font-family:var(--serif);}
  @media (prefers-reduced-motion:no-preference){
    .heart{animation:beat 4.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
    .beam{animation:shim 7s ease-in-out infinite;}
    .tw{animation:tw 3.6s ease-in-out infinite;}
    .tw:nth-child(3n){animation-duration:5.2s;animation-delay:-1.4s;}
    .tw:nth-child(4n){animation-duration:4.4s;animation-delay:-2.6s;}
    @keyframes beat{0%,100%{opacity:.85;transform:scale(1);}50%{opacity:1;transform:scale(1.28);}}
    @keyframes shim{0%,100%{opacity:.28;}50%{opacity:.5;}}
    @keyframes tw{0%,100%{opacity:.35;}50%{opacity:.95;}}
  }
</style>
