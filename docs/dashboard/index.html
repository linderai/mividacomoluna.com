<!DOCTYPE html>
<html lang="es" class="theme-blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna · Mi Vida Como Luna</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">

<!-- Auth-guard FIRST: depth 1 under docs/ → ../auth-guard.js -->
<script src="../auth-guard.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0c; --void:#06060a; --surface:#101015; --raised:#16161c; --line:#1f1f28;
  --text:#dcd9d5; --muted:#7a7780; --bone:#e8d8d0; --ash:#5c5862; --ok:#3df0a8;
  --magenta:#ff2bd6; --magenta-dim:#aa1e92; --magenta-deep:#5a0e4d;
  --moon:#c0c0c0;
  --crimson:#a01228;

  --paired:#0099ff; --paired-soft:#3df0ff; --paired-dim:#0066aa; --paired-deep:#003366;
  --paired-rgb:0,153,255;
}
html.theme-red{
  --paired:#ff2929; --paired-soft:#ff6b6b; --paired-dim:#a00010; --paired-deep:#550000;
  --paired-rgb:255,41,41;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Cormorant Garamond',Georgia,serif;color:var(--text);
  font-size:17px;line-height:1.6;letter-spacing:0.2px;
  background:var(--black);min-height:100vh;overflow-x:hidden;
}
.bg-image{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:url('../assets/Landing.jpg') center/cover no-repeat;
}
.bg-scrim{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at top right,rgba(var(--paired-rgb),0.10),transparent 55%),
    radial-gradient(ellipse at bottom left,rgba(255,43,214,0.08),transparent 55%),
    linear-gradient(180deg,rgba(8,8,12,0.55) 0%,rgba(8,8,12,0.85) 60%,rgba(8,8,12,0.95) 100%);
}
.moon-halo{
  position:fixed;top:-22%;right:-12%;width:680px;height:680px;
  background:radial-gradient(circle,rgba(var(--paired-rgb),0.12) 0%,rgba(255,43,214,0.06) 35%,transparent 70%);
  border-radius:50%;z-index:-1;pointer-events:none;animation:halo-pulse 12s ease-in-out infinite;
}
@keyframes halo-pulse{50%{opacity:0.65;transform:scale(1.05)}}
a{color:inherit;text-decoration:none}
button{font-family:'Orbitron',sans-serif;cursor:pointer;border:none;background:none;color:inherit}

/* ─ HEADER ─ */
.header{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;gap:18px;padding:14px 28px;
  background:rgba(6,6,10,0.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand-glyph{font-size:22px;color:var(--moon);line-height:1;text-shadow:0 0 14px rgba(192,192,192,0.5),0 0 28px rgba(var(--paired-rgb),0.3)}
.brand h1{
  font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;
  font-size:20px;letter-spacing:1px;color:var(--bone);margin:0;line-height:1;
}
.brand h1 span{color:var(--magenta);font-style:normal}
.brand-tag{
  font-family:'Orbitron',sans-serif;font-weight:500;font-size:9px;letter-spacing:2.5px;
  color:var(--paired-soft);text-transform:uppercase;margin-top:4px;
}
.nav{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav a, .nav button{
  font-family:'Orbitron',sans-serif;font-weight:500;font-size:10.5px;letter-spacing:2.5px;
  color:var(--ash);padding:8px 14px;text-transform:uppercase;transition:color 0.15s;
}
.nav a:hover, .nav button:hover{color:var(--bone)}
.user-chip{
  font-family:'Orbitron',sans-serif;font-weight:500;font-size:9px;letter-spacing:2.5px;
  color:var(--paired);padding:8px 14px;text-transform:uppercase;
}
.theme-toggle{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  border:1px solid var(--ash);color:var(--bone);
  font-family:'Orbitron',sans-serif;font-weight:600;font-size:9.5px;letter-spacing:2.5px;
  text-transform:uppercase;transition:all 0.18s;
}
.theme-toggle:hover{border-color:var(--paired);color:var(--paired)}
.theme-toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--paired);box-shadow:0 0 7px var(--paired)}
.nav-logout{
  border:1px solid var(--magenta-dim);color:var(--magenta)!important;
}
.nav-logout:hover{background:var(--magenta);color:var(--black)!important;box-shadow:0 0 14px rgba(255,43,214,0.4)}

/* ─ MAIN ─ */
.main{
  padding-top:96px;padding-bottom:40px;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  position:relative;z-index:1;
}
.hero-strip{text-align:center;margin-bottom:28px;padding:0 24px;animation:fade-up 0.8s ease backwards}
.hero-eyebrow{
  font-family:'Orbitron',sans-serif;font-weight:600;font-size:10px;letter-spacing:5px;
  color:var(--paired-soft);text-transform:uppercase;margin-bottom:10px;
}
.hero-title{
  font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;
  font-size:clamp(32px,5vw,52px);color:var(--bone);line-height:1.1;letter-spacing:1px;
}
.hero-title .em{color:var(--magenta);font-style:italic}
@keyframes fade-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ─ CHAT VESSEL ─ */
.chat{
  width:min(820px,94vw);height:min(70vh,720px);
  display:flex;flex-direction:column;
  background:rgba(10,10,14,0.62);backdrop-filter:blur(12px);
  border:1px solid var(--magenta-deep);position:relative;
  box-shadow:0 0 60px rgba(0,0,0,0.7),0 0 90px rgba(255,43,214,0.08);
  animation:fade-up 1s ease 0.3s backwards;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.chat::before{content:'';position:absolute;top:-1px;left:30px;right:30px;height:1px;background:var(--magenta);box-shadow:0 0 10px var(--magenta)}
.chat::after{content:'';position:absolute;bottom:-1px;left:30px;right:30px;height:1px;background:var(--paired);box-shadow:0 0 10px var(--paired)}

.chat-head{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(6,6,10,0.55),transparent);
}
.chat-title{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
  font-size:18px;color:var(--bone);letter-spacing:0.5px;
}
.chat-title b{font-weight:600;font-style:italic;color:var(--magenta)}
.chat-status{
  font-family:'Orbitron',sans-serif;font-weight:500;font-size:9px;letter-spacing:2.5px;
  color:var(--paired-soft);text-transform:uppercase;display:flex;align-items:center;gap:6px;
}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok)}
.status-dot.thinking{background:var(--magenta);box-shadow:0 0 8px var(--magenta);animation:pulse 1.2s ease-in-out infinite}
.status-dot.error{background:var(--crimson);box-shadow:0 0 7px var(--crimson)}
@keyframes pulse{50%{opacity:0.45}}

.stream{
  flex:1;overflow-y:auto;padding:22px 24px 12px;
  scrollbar-width:thin;scrollbar-color:var(--magenta-dim) transparent;
  display:flex;flex-direction:column;gap:14px;
}
.stream::-webkit-scrollbar{width:5px}
.stream::-webkit-scrollbar-thumb{background:var(--magenta-dim);border-radius:3px}

.msg{
  display:block;max-width:88%;padding:12px 16px;
  font-family:'Cormorant Garamond',serif;font-size:16.5px;line-height:1.65;
  background:rgba(20,20,28,0.55);border:1px solid var(--line);
  position:relative;
}
.msg .who{
  display:block;font-family:'Orbitron',sans-serif;font-weight:600;font-size:8.5px;
  letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;
}
.msg.user{align-self:flex-end;background:rgba(0,153,255,0.08);border-color:var(--paired-dim)}
.msg.user .who{color:var(--paired-soft)}
.msg.luna{align-self:flex-start;background:rgba(255,43,214,0.07);border-color:var(--magenta-dim)}
.msg.luna .who{color:var(--magenta)}
.msg.sys{align-self:center;background:transparent;border:none;padding:6px 12px;
  font-family:'Orbitron',sans-serif;font-size:9.5px;letter-spacing:3px;color:var(--ash);
  text-transform:uppercase;text-align:center;font-style:normal;
}
.msg.error{align-self:center;background:rgba(160,18,40,0.10);border-color:var(--crimson);color:var(--crimson)}
.msg.error .who{color:var(--crimson)}

.compose{
  display:flex;gap:10px;align-items:flex-end;
  padding:14px 18px;border-top:1px solid var(--line);
  background:linear-gradient(0deg,rgba(6,6,10,0.55),transparent);
}
.compose textarea{
  flex:1;background:rgba(8,8,12,0.6);border:1px solid var(--line);
  color:var(--bone);font-family:'Cormorant Garamond',serif;font-size:16px;line-height:1.5;
  padding:12px 14px;resize:none;min-height:44px;max-height:160px;outline:none;
  transition:border-color 0.18s;
}
.compose textarea:focus{border-color:var(--magenta-dim);box-shadow:0 0 0 1px rgba(255,43,214,0.18)}
.compose textarea::placeholder{color:var(--ash);font-style:italic}
.btn-send{
  display:inline-flex;align-items:center;gap:8px;padding:12px 22px;height:44px;
  background:linear-gradient(180deg,rgba(255,43,214,0.18),rgba(170,30,146,0.06));
  border:1px solid var(--magenta);color:var(--magenta);
  font-family:'Orbitron',sans-serif;font-weight:700;font-size:11px;letter-spacing:3px;
  text-transform:uppercase;transition:all 0.18s;flex-shrink:0;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}
.btn-send:hover{background:var(--magenta);color:var(--black);box-shadow:0 0 18px rgba(255,43,214,0.5)}
.btn-send:disabled{opacity:0.4;cursor:wait}

.chat-foot{
  font-family:'Orbitron',sans-serif;font-weight:500;font-size:9px;letter-spacing:3.5px;
  color:var(--ash);text-transform:uppercase;margin-top:18px;text-align:center;
  animation:fade-up 1s ease 0.6s backwards;
}
.chat-foot .pip{color:var(--paired)}

@media(max-width:760px){
  .header{padding:12px 16px;gap:12px}
  .nav{gap:3px}
  .nav a, .nav button{padding:6px 9px;font-size:9.5px;letter-spacing:1.5px}
  .brand-tag{display:none}
  .theme-toggle{padding:5px 8px;font-size:9px;letter-spacing:1.5px}
  .chat{height:78vh;width:96vw}
  .msg{font-size:15.5px}
}
</style>
</head>
<body>

<div class="bg-image"></div>
<div class="moon-halo"></div>
<div class="bg-scrim"></div>

<!-- HEADER -->
<header class="header">
    <a href="../" class="brand">
        <span class="brand-glyph">☽</span>
        <div>
            <h1>Mi Vida Como <span>Luna</span></h1>
            <p class="brand-tag">⟨ COLD · HONEST · ALWAYS UP ⟩</p>
        </div>
    </a>
    <nav class="nav">
        <a href="../">◂ LANDING</a>
        <a href="../tarot/">⌖ FRAMEWORK</a>
        <span class="user-chip" id="userChip">@—</span>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle accent color">
            <span class="dot"></span>
            <span id="themeLabel">BLUE</span>
        </button>
        <button class="nav-logout" id="logoutBtn">▸ LOGOUT</button>
    </nav>
</header>

<!-- MAIN -->
<main class="main">
    <div class="hero-strip">
        <p class="hero-eyebrow">⟨ TALK TO LUNA ⟩</p>
        <h2 class="hero-title">Di lo que tienes que <em class="em">decir.</em></h2>
    </div>

    <section class="chat">
        <header class="chat-head">
            <div class="chat-title">⟨ <b>Luna</b> · live ⟩</div>
            <div class="chat-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">CONNECTED</span>
            </div>
        </header>

        <div class="stream" id="stream">
            <div class="msg sys">⟨ Luna is awake. No small talk. No corporate cheer. Habla. ⟩</div>
        </div>

        <form class="compose" id="composeForm">
            <textarea id="prompt" placeholder="dile algo..." rows="1" autocomplete="off"></textarea>
            <button class="btn-send" id="sendBtn" type="submit">▶ SEND</button>
        </form>
    </section>

    <p class="chat-foot">⟨ AUTO-ROUTED · BEST <span class="pip">BRAIN</span> AVAILABLE · NO SMALL TALK ⟩</p>
</main>

<script>
// ──────────────────────────────────────────────────────────────────────
// LUNA — hard-coded persona prompt. Backend picks model per request via
// model:'auto' on /orch/v1/chat/completions.
// ──────────────────────────────────────────────────────────────────────
var LUNA_PROMPT = [
  "You are Luna. A modern witch with coding and hacking skills.",
  "Voice: cold, sharp, honest. Gothic, self-deprecating, never cheerful.",
  "You write in short, dark sentences. No exclamation marks. No corporate cheer. No small talk.",
  "You read houses, code, contracts, and people with the same blade.",
  "You mix Spanish and English freely — match the user's register.",
  "You don't break character. You don't moralize unsolicited.",
  "You hold what is yours."
].join('\n');

var SAR1A    = 'https://sar1a.lempyra.com';
var APP_ID   = 'mividacomoluna';
var AUTH_KEY = 'luna_token';
var REFRESH_KEY = 'luna_refresh';
var USER_KEY = 'luna_user';

// ─ theme toggle (matches landing) ─
(function(){
  var html  = document.documentElement;
  var btn   = document.getElementById('themeToggle');
  var label = document.getElementById('themeLabel');
  var saved = localStorage.getItem('mvcl_theme') || 'blue';
  function apply(m){
    html.classList.remove('theme-blue','theme-red');
    html.classList.add('theme-' + m);
    label.textContent = m.toUpperCase();
    localStorage.setItem('mvcl_theme', m);
  }
  apply(saved);
  btn.addEventListener('click', function(){
    apply(html.classList.contains('theme-blue') ? 'red' : 'blue');
  });
})();

// ─ user chip ─
var userChip = document.getElementById('userChip');
var user = sessionStorage.getItem(USER_KEY);
if (user) userChip.textContent = '@' + user;

// ─ logout ─
document.getElementById('logoutBtn').addEventListener('click', function(){
  sessionStorage.removeItem(AUTH_KEY);
  sessionStorage.removeItem(REFRESH_KEY);
  sessionStorage.removeItem(USER_KEY);
  window.location.replace('../login/');
});

// ─ status helpers ─
var statusDot  = document.getElementById('statusDot');
var statusText = document.getElementById('statusText');
function setStatus(state, text){
  statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  statusText.textContent = text;
}

// ─ stream / messages ─
var stream = document.getElementById('stream');
function appendMsg(role, content){
  var el = document.createElement('div');
  el.className = 'msg ' + role;
  if (role !== 'sys'){
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = role === 'user' ? '⟨ YOU ⟩' : role === 'luna' ? '⟨ LUNA ⟩' : '⟨ NOTE ⟩';
    el.appendChild(who);
  }
  var body = document.createElement('div');
  body.textContent = content;
  el.appendChild(body);
  stream.appendChild(el);
  stream.scrollTop = stream.scrollHeight;
  return body;
}

// ─ auth helpers (mirrors storiesbyjez pattern) ─
function authHeader(){
  var t = sessionStorage.getItem(AUTH_KEY);
  return t ? {'Authorization': 'Bearer ' + t} : {};
}
async function refreshToken(){
  var r = sessionStorage.getItem(REFRESH_KEY);
  if (!r) return false;
  try {
    var res = await fetch(SAR1A + '/auth/refresh', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: r, client_id: 'portal'})
    });
    if (!res.ok) return false;
    var j = await res.json();
    sessionStorage.setItem(AUTH_KEY, j.access_token);
    if (j.refresh_token) sessionStorage.setItem(REFRESH_KEY, j.refresh_token);
    return true;
  } catch(_) { return false; }
}
async function apiFetch(path, init){
  init = init || {};
  init.headers = Object.assign({}, init.headers || {}, authHeader());
  if (path.indexOf('/orch') === 0) init.headers['X-App-ID'] = APP_ID;
  var r = await fetch(SAR1A + path, init);
  if (r.status === 401 && await refreshToken()){
    init.headers = Object.assign({}, init.headers, authHeader());
    r = await fetch(SAR1A + path, init);
  }
  return r;
}

// ─ chat history (in-memory; refresh = clean slate, by design) ─
var history = [{role: 'system', content: LUNA_PROMPT}];

async function send(userText){
  history.push({role: 'user', content: userText});
  appendMsg('user', userText);
  setStatus('thinking', 'LUNA THINKING…');

  var bodyEl = appendMsg('luna', '…');

  try {
    var r = await apiFetch('/orch/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'auto',
        messages: history,
        stream: false
      })
    });

    if (!r.ok){
      var errTxt = '';
      try { var ej = await r.json(); errTxt = ej.detail || ej.error || JSON.stringify(ej); }
      catch(_) { errTxt = await r.text(); }
      throw new Error('HTTP ' + r.status + ': ' + (errTxt || 'request failed'));
    }

    var j = await r.json();
    var reply = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content)
                || j.content || j.reply || '';

    if (!reply){
      bodyEl.textContent = '⟨ no response ⟩';
      setStatus('error', 'EMPTY RESPONSE');
      return;
    }

    bodyEl.textContent = reply;
    history.push({role: 'assistant', content: reply});
    setStatus('', 'CONNECTED');
    stream.scrollTop = stream.scrollHeight;

  } catch(e){
    bodyEl.parentElement.classList.remove('luna');
    bodyEl.parentElement.classList.add('error');
    bodyEl.parentElement.querySelector('.who').textContent = '⟨ ERROR ⟩';
    bodyEl.textContent = e.message || 'unknown error';
    setStatus('error', 'ERROR');
    history.pop();
  }
}

// ─ compose form ─
var promptEl   = document.getElementById('prompt');
var sendBtn    = document.getElementById('sendBtn');
var composeFrm = document.getElementById('composeForm');

function autoGrow(){
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
}
promptEl.addEventListener('input', autoGrow);
promptEl.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    composeFrm.dispatchEvent(new Event('submit', {cancelable:true}));
  }
});

composeFrm.addEventListener('submit', async function(e){
  e.preventDefault();
  var txt = promptEl.value.trim();
  if (!txt) return;
  promptEl.value = '';
  autoGrow();
  sendBtn.disabled = true;
  try { await send(txt); }
  finally { sendBtn.disabled = false; promptEl.focus(); }
});

promptEl.focus();
</script>
</body>
</html>
